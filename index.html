<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/favicon.png" type="image/x-icon">
</head>

<body>
    <canvas></canvas>
    <script src="js/game.js"></script>
    <script src="js/map.js"></script>
    <script src="js/tile.js"></script>
    <script src="js/monster.js"></script>
    <script src="js/util.js"></script>
    <script src="js/spell.js"></script>
    <script>
        tileSize = 64;
        numTiles = 11;
        uiWidth = 4;
        level = 1;

        spritesheet = new Image()
        spritesheet.src = 'spritesheet.png'

        spritesheet.onload = showTitle;
        gameState = 'loading';
        startingHp = 3;
        numLevels = 6;

        htmltag.addEventListener('keyup', function (e) {
            console.log(e.key)
            if (gameState == "title") {
                startGame();
            } else if (gameState == "dead") {
                showTitle();
            } else if (gameState == "running") {
                if (e.key.toLowerCase() == "w") player.tryMove(0, -1);
                if (e.key.toLowerCase() == "s") player.tryMove(0, 1);
                if (e.key.toLowerCase() == "a") player.tryMove(-1, 0);
                if (e.key.toLowerCase() == "d") player.tryMove(1, 0);
            }
        });






        setInterval(draw, 15);
        setupCanvas();



    </script>




</body>

</html>
